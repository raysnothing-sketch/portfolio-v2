name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy to Cloudflare Workers
        run: |
          pnpm exec opennextjs-cloudflare build
          pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://dsh-trainer.raysnothing.workers.dev
          NEXT_PUBLIC_CONTACT_EMAIL: raysnothing@gmail.com

      - name: Set runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GITHUB_TOKEN_VALUE: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
          GITHUB_USERNAME: raysnothing-sketch
        run: |
          printf '%s' "$TURSO_DATABASE_URL" | pnpm exec wrangler secret put TURSO_DATABASE_URL --name dsh-trainer
          printf '%s' "$TURSO_AUTH_TOKEN" | pnpm exec wrangler secret put TURSO_AUTH_TOKEN --name dsh-trainer
          printf '%s' "$GITHUB_TOKEN_VALUE" | pnpm exec wrangler secret put GITHUB_TOKEN --name dsh-trainer
          printf '%s' "$GITHUB_USERNAME" | pnpm exec wrangler secret put GITHUB_USERNAME --name dsh-trainer
